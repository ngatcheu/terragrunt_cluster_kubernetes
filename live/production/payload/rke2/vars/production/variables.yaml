---
rke2_version: v1.35.2+rke2r1
rke2_ha_mode: true
rke2_ha_mode_keepalived: true
rke2_api_ip: 192.168.1.132
rke2_download_kubeconf: true
rke2_download_kubeconf_path: ./
rke2_download_kubeconf_file_name: kubeconfig.yaml
rke2_cni: cilium
rke2_server_node_taints:
 - 'CriticalAddonsOnly=true:NoExecute'
# Configuration explicite des CIDRs pour éviter les conflits Calico/Canal
rke2_cluster_cidr:
  - 10.42.0.0/16
rke2_service_cidr:
  - 10.43.0.0/16
rke2_ingress_controller: none

# Groupes d'inventaire
rke2_servers_group_name: masters
rke2_agents_group_name: workers
rke2_cluster_group_name: k8s_cluster

# Chemins RKE2
rke2_data_path: /var/lib/rancher/rke2

# Snapshots etcd
rke2_etcd_snapshot_destination_dir: "{{ rke2_data_path }}/server/db/snapshots"
rke2_etcd_snapshot_source_dir: etcd_snapshots
rke2_etcd_snapshot_file: ""

# Backup
backup_local_dir: "{{ playbook_dir }}/backups"
backup_snapshot_dir: "{{ playbook_dir }}/{{ rke2_etcd_snapshot_source_dir }}"